filter","mutants":[]}},"projectRoot":"/home/runner/work/researchtrack-backend/researchtrack-backend/src/Services/ResearchTrack.SubmissionService","schemaVersion":"2","testFiles":{"/home/runner/work/researchtrack-backend/researchtrack-backend/tests/ResearchTrack.SubmissionService.MutationTests/Services/ResearchSubmissionCoverageHardeningTests.cs":{"language":"cs","source":"using Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\nusing NSubstitute;\nusing ResearchTrack.BuildingBlocks.Api.Exceptions;\nusing ResearchTrack.SubmissionService.Configuration;\nusing ResearchTrack.SubmissionService.Contracts;\nusing ResearchTrack.SubmissionService.Domain;\nusing ResearchTrack.SubmissionService.Features;\nusing ResearchTrack.SubmissionService.Infrastructure;\nusing ResearchTrack.SubmissionService.Persistence;\n\nnamespace ResearchTrack.SubmissionService.MutationTests.Services;\n\npublic sealed class ResearchSubmissionCoverageHardeningTests\n{\n    private static readonly DateTimeOffset Now = new(2026, 10, 10, 10, 0, 0, TimeSpan.Zero);\n\n    [Fact]\n    public async Task CreateUploadSessionAsync_MissingRequirement_ReturnsNotFoundBeforeStorage()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), storage);\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CreateUploadSessionAsync(\n            projectId, Guid.NewGuid(), studentId,\n            new CreateUploadSessionRequest(\u0022report.pdf\u0022, \u0022application/pdf\u0022, 1000, null),\n            CancellationToken.None));\n\n        Assert.Equal(404, exception.StatusCode);\n        await storage.DidNotReceive().CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), Arg.Any\u003Cstring\u003E(), Arg.Any\u003CCancellationToken\u003E());\n    }\n\n    [Fact]\n    public async Task CreateUploadSessionAsync_ClosedRequirement_ReturnsConflict()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Closed);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CreateUploadSessionAsync(\n            projectId, requirement.Id, studentId,\n            new CreateUploadSessionRequest(\u0022report.pdf\u0022, \u0022application/pdf\u0022, 1000, null),\n            CancellationToken.None));\n\n        Assert.Equal(409, exception.StatusCode);\n    }\n\n    [Fact]\n    public async Task CreateUploadSessionAsync_ExistingPendingSubmissionWithoutChangeRequest_ReturnsConflict()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Open);\n        await SeedSubmissionAsync(factory, projectId, requirement.Id, SubmissionConstants.SubmissionStatus.PendingReview);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CreateUploadSessionAsync(\n            projectId, requirement.Id, studentId,\n            new CreateUploadSessionRequest(\u0022report.pdf\u0022, \u0022application/pdf\u0022, 1000, null),\n            CancellationToken.None));\n\n        Assert.Equal(409, exception.StatusCode);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSessionAsync_MissingSession_ReturnsNotFound()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CompleteUploadSessionAsync(\n            projectId, Guid.NewGuid(), studentId, CancellationToken.None));\n\n        Assert.Equal(404, exception.StatusCode);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSessionAsync_DifferentCreator_IsForbidden()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var creator = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, creator, SubmissionConstants.RequirementStatus.Open);\n        var session = await SeedUploadSessionAsync(factory, projectId, requirement.Id, creator, SubmissionConstants.UploadSessionStatus.Pending);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, creator), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CompleteUploadSessionAsync(\n            projectId, session.Id, Guid.NewGuid(), CancellationToken.None));\n\n        Assert.Equal(403, exception.StatusCode);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSessionAsync_FailedSession_ReturnsConflict()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Open);\n        var session = await SeedUploadSessionAsync(factory, projectId, requirement.Id, studentId, SubmissionConstants.UploadSessionStatus.Failed);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.CompleteUploadSessionAsync(\n            projectId, session.Id, studentId, CancellationToken.None));\n\n        Assert.Equal(409, exception.StatusCode);\n    }\n\n    [Theory]\n    [InlineData(\u0022BOGUS\u0022, \u0022feedback\u0022)]\n    [InlineData(\u0022CHANGES_REQUESTED\u0022, null)]\n    [InlineData(\u0022REJECTED\u0022, \u0022\u0022)]\n    public async Task ReviewAsync_InvalidDecisionOrFeedback_IsRejectedBeforeLookup(string decision, string? feedback)\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        var sut = CreateSut(factory, auth, storage);\n\n        await Assert.ThrowsAsync\u003CApiValidationException\u003E(() =\u003E sut.ReviewAsync(\n            projectId, Guid.NewGuid(), Guid.NewGuid(),\n            new CreateSubmissionReviewRequest(Guid.NewGuid(), decision, feedback),\n            CancellationToken.None));\n    }\n\n    [Fact]\n    public async Task ReviewAsync_EmptyVersionId_IsValidationError()\n    {\n        var sut = CreateSut(new TestSubmissionDbContextFactory(), Substitute.For\u003CIProjectAuthorizationClient\u003E(), Substitute.For\u003CIObjectStorageService\u003E());\n        await Assert.ThrowsAsync\u003CApiValidationException\u003E(() =\u003E sut.ReviewAsync(\n            Guid.NewGuid(), Guid.NewGuid(), Guid.NewGuid(),\n            new CreateSubmissionReviewRequest(Guid.Empty, SubmissionConstants.ReviewDecision.Approved, null),\n            CancellationToken.None));\n    }\n\n    [Fact]\n    public async Task GetDownloadUrlAsync_MissingSubmission_ReturnsNotFoundAfterAuthorization()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        var projectId = Guid.NewGuid();\n        var sut = CreateSut(factory, auth, Substitute.For\u003CIObjectStorageService\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.GetDownloadUrlAsync(\n            projectId, Guid.NewGuid(), Guid.NewGuid(), false, CancellationToken.None));\n\n        Assert.Equal(404, exception.StatusCode);\n        await auth.Received(1).EnsureCanAccessAsync(projectId, CancellationToken.None);\n    }\n\n    private static ResearchSubmissionService CreateSut(\n        IDbContextFactory\u003CSubmissionDbContext\u003E factory,\n        IProjectAuthorizationClient auth,\n        IObjectStorageService storage)\n    {\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E()).Returns(\u0022Supervisor\u0022);\n        return new ResearchSubmissionService(\n            factory, auth, profile, storage,\n            new SubmissionOptions { AllowedFileTypes = [\u0022pdf\u0022, \u0022docx\u0022, \u0022pptx\u0022, \u0022zip\u0022], UploadSessionLifetimeMinutes = 10 },\n            new FixedTimeProvider(Now), NullLogger\u003CResearchSubmissionService\u003E.Instance);\n    }\n\n    private static IProjectAuthorizationClient AuthorizedContext(Guid projectId, Guid studentId)\n    {\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        auth.GetSubmissionContextAsync(projectId, Arg.Any\u003CCancellationToken\u003E()).Returns(\n            new ProjectSubmissionContext(\n                new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022),\n                [new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022)]));\n        return auth;\n    }\n\n    private static async Task\u003CSubmissionRequirement\u003E SeedRequirementAsync(\n        TestSubmissionDbContextFactory factory, Guid projectId, Guid studentId, string status)\n    {\n        var requirement = new SubmissionRequirement\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, Title = \u0022Final report\u0022,\n            AllowedFileTypes = \u0022pdf,docx\u0022, MaxFileSizeBytes = 10 * 1024 * 1024,\n            Status = status, ResponsibilityMode = SubmissionConstants.ResponsibilityMode.ProjectLeader,\n            AssignedStudentId = studentId, AssignedStudentName = \u0022Sam Student\u0022,\n            CreatedBy = Guid.NewGuid(), CreatedByName = \u0022Supervisor\u0022, CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionRequirements.Add(requirement);\n        await db.SaveChangesAsync(CancellationToken.None);\n        return requirement;\n    }\n\n    private static async Task\u003CResearchSubmission\u003E SeedSubmissionAsync(\n        TestSubmissionDbContextFactory factory, Guid projectId, Guid requirementId, string status)\n    {\n        var versionId = Guid.NewGuid();\n        var submission = new ResearchSubmission\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, RequirementId = requirementId,\n            Status = status, CurrentVersionId = versionId, VersionCount = 1,\n            LastSubmittedAt = Now, CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.ResearchSubmissions.Add(submission);\n        await db.SaveChangesAsync(CancellationToken.None);\n        return submission;\n    }\n\n    private static async Task\u003CSubmissionUploadSession\u003E SeedUploadSessionAsync(\n        TestSubmissionDbContextFactory factory, Guid projectId, Guid requirementId, Guid creator, string status)\n    {\n        var session = new SubmissionUploadSession\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, RequirementId = requirementId,\n            SubmissionId = Guid.NewGuid(), VersionId = Guid.NewGuid(), ExpectedVersionNumber = 1,\n            TemporaryObjectKey = \u0022pending/test\u0022, FinalObjectKey = \u0022projects/final\u0022,\n            OriginalFileName = \u0022report.pdf\u0022, FileExtension = \u0022pdf\u0022, ExpectedContentType = \u0022application/pdf\u0022,\n            DeclaredFileSizeBytes = 1000, ExpectedMaxFileSizeBytes = 10 * 1024 * 1024,\n            CreatedBy = creator, CreatedByName = \u0022Sam Student\u0022, Status = status,\n            ActiveSlot = status == SubmissionConstants.UploadSessionStatus.Pending ? \u0022ACTIVE\u0022 : null,\n            ExpiresAt = Now.AddMinutes(10), CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionUploadSessions.Add(session);\n        await db.SaveChangesAsync(CancellationToken.None);\n        return session;\n    }\n\n    private sealed class TestSubmissionDbContextFactory : IDbContextFactory\u003CSubmissionDbContext\u003E\n    {\n        private readonly DbContextOptions\u003CSubmissionDbContext\u003E _options =\n            new DbContextOptionsBuilder\u003CSubmissionDbContext\u003E()\n                .UseInMemoryDatabase($\u0022submission-coverage-hardening-{Guid.NewGuid():N}\u0022)\n                .Options;\n        public SubmissionDbContext CreateDbContext() =\u003E new(_options);\n        public Task\u003CSubmissionDbContext\u003E CreateDbContextAsync(CancellationToken cancellationToken = default) =\u003E\n            Task.FromResult(CreateDbContext());\n    }\n\n    private sealed class FixedTimeProvider(DateTimeOffset now) : TimeProvider\n    {\n        public override DateTimeOffset GetUtcNow() =\u003E now;\n    }\n}\n","tests":[{"id":"27e27cc4-1b1c-6885-0014-f974e7e864a4","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionCoverageHardeningTests.CreateUploadSessionAsync_MissingRequirement_ReturnsNotF bContextFactory();\n        var studentId = Guid.NewGuid();\n        var projectId = Guid.NewGuid();\n        var requirementId = await SeedOpenRequirementAsync(factory, projectId, studentId);\n        var auth = AuthorizedStudentContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E()).Returns(\u0022Sam Student\u0022);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), \u0022application/pdf\u0022, Arg.Any\u003CCancellationToken\u003E())\n            .Returns(new ObjectUploadGrant(\u0022https://upload.example.test\u0022, Now.AddMinutes(5), new Dictionary\u003Cstring, string\u003E { [\u0022Content-Type\u0022] = \u0022application/pdf\u0022 }));\n        var sut = CreateSut(factory, auth, profile, storage);\n\n        var result = await sut.CreateUploadSessionAsync(projectId, requirementId, studentId,\n            new CreateUploadSessionRequest(\u0022report.pdf\u0022, \u0022application/pdf\u0022, 1024, \u0022v1\u0022),\n            CancellationToken.None);\n\n        Assert.Equal(1, result.VersionNumber);\n        Assert.Equal(\u0022https://upload.example.test\u0022, result.UploadUrl);\n        await storage.Received(1).CreateUploadGrantAsync(\n            Arg.Is\u003Cstring\u003E(key =\u003E key.StartsWith(\u0022pending/\u0022, StringComparison.Ordinal)),\n            \u0022application/pdf\u0022, Arg.Any\u003CCancellationToken\u003E());\n        await profile.Received(1).GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E());\n        await using var db = factory.CreateDbContext();\n        var session = Assert.Single(db.SubmissionUploadSessions);\n        Assert.Equal(\u0022ACTIVE\u0022, session.ActiveSlot);\n        Assert.Equal(SubmissionConstants.UploadSessionStatus.Pending, session.Status);\n    }\n\n    [Fact]\n    public async Task CreateUploadSessionAsync_InvalidFile_DoesNotCallProfileOrStorage()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var studentId = Guid.NewGuid();\n        var projectId = Guid.NewGuid();\n        var requirementId = await SeedOpenRequirementAsync(factory, projectId, studentId);\n        var auth = AuthorizedStudentContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        var sut = CreateSut(factory, auth, profile, storage);\n\n        await Assert.ThrowsAsync\u003CApiValidationException\u003E(() =\u003E sut.CreateUploadSessionAsync(projectId, requirementId, studentId,\n            new CreateUploadSessionRequest(\u0022malware.exe\u0022, \u0022application/octet-stream\u0022, 1024, null),\n            CancellationToken.None));\n\n        await storage.DidNotReceive().CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), Arg.Any\u003Cstring\u003E(), Arg.Any\u003CCancellationToken\u003E());\n        await profile.DidNotReceive().GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E());\n    }\n\n    [Fact]\n    public async Task CreateUploadSessionAsync_StorageGrantFailure_MarksSessionFailed()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var studentId = Guid.NewGuid();\n        var projectId = Guid.NewGuid();\n        var requirementId = await SeedOpenRequirementAsync(factory, projectId, studentId);\n        var auth = AuthorizedStudentContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E()).Returns(\u0022Sam Student\u0022);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), Arg.Any\u003Cstring\u003E(), Arg.Any\u003CCancellationToken\u003E())\n            .Returns(_ =\u003E Task.FromException\u003CObjectUploadGrant\u003E(new InvalidOperationException(\u0022storage unavailable\u0022)));\n        var sut = CreateSut(factory, auth, profile, storage);\n\n        await Assert.ThrowsAsync\u003CInvalidOperationException\u003E(() =\u003E sut.CreateUploadSessionAsync(projectId, requirementId, studentId,\n            new CreateUploadSessionRequest(\u0022report.pdf\u0022, \u0022application/pdf\u0022, 1024, null),\n            CancellationToken.None));\n\n        await using var db = factory.CreateDbContext();\n        var session = Assert.Single(db.SubmissionUploadSessions);\n        Assert.Equal(SubmissionConstants.UploadSessionStatus.Failed, session.Status);\n        Assert.Null(session.ActiveSlot);\n        Assert.NotNull(session.FailureReason);\n    }\n\n    private static IProjectAuthorizationClient AuthorizedStudentContext(Guid projectId, Guid studentId)\n    {\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        auth.GetSubmissionContextAsync(projectId, Arg.Any\u003CCancellationToken\u003E()).Returns(\n            new ProjectSubmissionContext(\n                new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022),\n                [new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022)]));\n        return auth;\n    }\n\n    private static ResearchSubmissionService CreateSut(\n        IDbContextFactory\u003CSubmissionDbContext\u003E factory,\n        IProjectAuthorizationClient auth,\n        IUserProfileClient profile,\n        IObjectStorageService storage) =\u003E new(\n            factory, auth, profile, storage,\n            new SubmissionOptions { AllowedFileTypes = [\u0022pdf\u0022, \u0022docx\u0022, \u0022pptx\u0022, \u0022zip\u0022], UploadSessionLifetimeMinutes = 10 },\n            new FixedTimeProvider(Now), NullLogger\u003CResearchSubmissionService\u003E.Instance);\n\n    private static async Task\u003CGuid\u003E SeedOpenRequirementAsync(TestSubmissionDbContextFactory factory, Guid projectId, Guid studentId)\n    {\n        var requirement = new SubmissionRequirement\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, Title = \u0022Final report\u0022, AllowedFileTypes = \u0022pdf,docx,pptx,zip\u0022,\n            MaxFileSizeBytes = 10 * 1024 * 1024, Status = SubmissionConstants.RequirementStatus.Open,\n            ResponsibilityMode = SubmissionConstants.ResponsibilityMode.ProjectLeader,\n            AssignedStudentId = studentId, AssignedStudentName = \u0022Sam Student\u0022, CreatedBy = Guid.NewGuid(),\n            CreatedByName = \u0022Supervisor\u0022, CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionRequirements.Add(requirement);\n        await db.SaveChangesAsync(CancellationToken.None);\n        return requirement.Id;\n    }\n\n    private sealed class TestSubmissionDbContextFactory : IDbContextFactory\u003CSubmissionDbContext\u003E\n    {\n        private readonly DbContextOptions\u003CSubmissionDbContext\u003E _options = new DbContextOptionsBuilder\u003CSubmissionDbContext\u003E()\n            .UseInMemoryDatabase($\u0022submission-mock-tests-{Guid.NewGuid():N}\u0022).Options;\n        public SubmissionDbContext CreateDbContext() =\u003E new(_options);\n        public Task\u003CSubmissionDbContext\u003E CreateDbContextAsync(CancellationToken cancellationToken = default) =\u003E Task.FromResult(CreateDbContext());\n    }\n\n    private sealed class FixedTimeProvider(DateTimeOffset utcNow) : TimeProvider\n    {\n        public override DateTimeOffset GetUtcNow() =\u003E utcNow;\n    }\n}\n","tests":[{"id":"3b72cb41-ce5e-9ce9-d2c4-5d14b22b8938","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionServiceMockTests.CreateUploadSessionAsync_ValidRequest_CreatesStorageGrantExactlyOnce","location":{"start":{"line":18,"column":5},"end":{"line":47,"column":6}}},{"id":"2ab1c0fa-cb1c-4156-8897-0d19ad4436e1","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionServiceMockTests.CreateUploadSessionAsync_InvalidFile_DoesNotCallProfileOrStorage","location":{"start":{"line":49,"column":5},"end":{"line":67,"column":6}}},{"id":"04099be0-0d61-4b96-3626-67900c1d1378","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionServiceMockTests.CreateUploadSessionAsync_StorageGrantFailure_MarksSessionFailed","location":{"start":{"line":69,"column":5},"end":{"line":93,"column":6}}}]},"/home/runner/work/researchtrack-backend/researchtrack-backend/tests/ResearchTrack.SubmissionService.MutationTests/Services/ResearchSubmissionSuccessfulFlowCoverageTests.cs":{"language":"cs","source":"using Microsoft.Data.Sqlite;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\nusing NSubstitute;\nusing ResearchTrack.SubmissionService.Configuration;\nusing ResearchTrack.SubmissionService.Contracts;\nusing ResearchTrack.SubmissionService.Domain;\nusing ResearchTrack.SubmissionService.Features;\nusing ResearchTrack.SubmissionService.Infrastructure;\nusing ResearchTrack.SubmissionService.Persistence;\n\nnamespace ResearchTrack.SubmissionService.MutationTests.Services;\n\npublic sealed class ResearchSubmissionSuccessfulFlowCoverageTests\n{\n    private static readonly DateTimeOffset Now = new(2026, 10, 10, 11, 0, 0, TimeSpan.Zero);\n\n    [Fact]\n    public async Task CreateAndCompleteUploadSession_FirstVersion_PersistsSubmissionVersionAndCompletesSession()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, ct);\n        var auth = AuthorizedContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(ct).Returns(\u0022Sam Student\u0022);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), \u0022application/pdf\u0022, ct)\n            .Returns(new ObjectUploadGrant(\u0022https://upload\u0022, Now.AddMinutes(5), new Dictionary\u003Cstring, string\u003E()));\n        storage.GetMetadataAsync(Arg.Any\u003Cstring\u003E(), ct)\n            .Returns(new StoredObjectMetadata(1024, \u0022application/pdf\u0022, \u0022etag-1\u0022));\n        var sut = CreateSut(factory, auth, profile, storage);\n\n        var upload = await sut.CreateUploadSessionAsync(\n            projectId,\n            requirement.Id,\n            studentId,\n            new CreateUploadSessionRequest(\u0022 report.pdf \u0022, \u0022application/pdf\u0022, 1024, \u0022 first version \u0022),\n            ct);\n        var completed = await sut.CompleteUploadSessionAsync(projectId, upload.UploadSessionId, studentId, ct);\n\n        Assert.Equal(1, upload.VersionNumber);\n        Assert.Equal(SubmissionConstants.SubmissionStatus.PendingReview, completed.Status);\n        Assert.Equal(1, completed.VersionCount);\n        var version = Assert.Single(completed.Versions);\n        Assert.Equal(\u0022report.pdf\u0022, version.OriginalFileName);\n        Assert.Equal(\u0022first version\u0022, version.SubmissionNote);\n        Assert.True(version.IsCurrent);\n        await storage.Received(1).PromoteAsync(Arg.Is\u003Cstring\u003E(x =\u003E x.StartsWith(\u0022pending/\u0022, StringComparison.Ordinal)), Arg.Any\u003Cstring\u003E(), ct);\n        await storage.Received().DeleteIfExistsAsync(Arg.Is\u003Cstring\u003E(x =\u003E x.StartsWith(\u0022pending/\u0022, StringComparison.Ordinal)), Arg.Any\u003CCancellationToken\u003E());\n\n        await using var db = factory.CreateDbContext();\n        Assert.Single(await db.ResearchSubmissions.ToListAsync(ct));\n        Assert.Single(await db.SubmissionVersions.ToListAsync(ct));\n        var session = await db.SubmissionUploadSessions.SingleAsync(ct);\n        Assert.Equal(SubmissionConstants.UploadSessionStatus.Completed, session.Status);\n        Assert.Null(session.ActiveSlot);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSession_AlreadyCompleted_ReturnsExistingResponseWithoutPromotingAgain()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var seeded = await SeedCompletedSubmissionAsync(factory, projectId, studentId, ct);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E(), storage);\n\n        var response = await sut.CompleteUploadSessionAsync(projectId, seeded.SessionId, studentId, ct);\n\n        Assert.Equal(seeded.SubmissionId, response.Id);\n        Assert.Equal(1, response.VersionCount);\n        await storage.DidNotReceive().PromoteAsync(Arg.Any\u003Cstring\u003E(), Arg.Any\u003Cstring\u003E(), ct);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSession_ExpiredSession_MarksExpiredAndDeletesTemporaryObject()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, ct);\n        var session = await SeedPendingSessionAsync(factory, projectId, requirement.Id, studentId, Now.AddMinutes(-1), ct);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E(), storage);\n\n        await Assert.ThrowsAsync\u003CResearchTrack.BuildingBlocks.Api.Exceptions.ApiException\u003E(() =\u003E\n            sut.CompleteUploadSessionAsync(projectId, session.Id, studentId, ct));\n\n        await storage.Received(1).DeleteIfExistsAsync(session.TemporaryObjectKey, Arg.Any\u003CCancellationToken\u003E());\n        await using var db = factory.CreateDbContext();\n        var stored = await db.SubmissionUploadSessions.SingleAsync(x =\u003E x.Id == session.Id, ct);\n        Assert.Equal(SubmissionConstants.UploadSessionStatus.Expired, stored.Status);\n        Assert.Null(stored.ActiveSlot);\n    }\n\n    [Fact]\n    public async Task CompleteUploadSession_MissingStorageObject_ReturnsValidationErrorWithoutPromotion()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, ct);\n        var session = await SeedPendingSessionAsync(factory, projectId, requirement.Id, studentId, Now.AddMinutes(5), ct);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.GetMetadataAsync(session.TemporaryObjectKey, ct).Returns((StoredObjectMetadata?)null);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E(), storage);\n\n        await Assert.ThrowsAsync\u003CResearchTrack.BuildingBlocks.Api.Exceptions.ApiValidationException\u003E(() =\u003E\n            sut.CompleteUploadSessionAsync(projectId, session.Id, studentId, ct));\n\n        await storage.DidNotReceive().PromoteAsync(Arg.Any\u003Cstring\u003E(), Arg.Any\u003Cstring\u003E(), ct);\n    }\n\n    [Fact]\n    public async Task ReviewAsync_ApproveCurrentVersion_PersistsReviewAndApprovalState()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var seeded = await SeedCompletedSubmissionAsync(factory, projectId, studentId, ct, sessionCompleted: false);\n        var auth = AuthorizedContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(ct).Returns(\u0022Supervisor Name\u0022);\n        var sut = CreateSut(factory, auth, profile, Substitute.For\u003CIObjectStorageService\u003E());\n        var reviewerId = Guid.NewGuid();\n\n        var response = await sut.ReviewAsync(projectId, seeded.SubmissionId, reviewerId,\n            new CreateSubmissionReviewRequest(seeded.VersionId, SubmissionConstants.ReviewDecision.Approved, null), ct);\n\n        Assert.Equal(SubmissionConstants.SubmissionStatus.Approved, response.Status);\n        Assert.Equal(seeded.VersionId, response.ApprovedVersionId);\n        Assert.NotNull(response.ApprovedAt);\n        var version = Assert.Single(response.Versions);\n        Assert.True(version.IsApproved);\n        Assert.NotNull(version.Review);\n        Assert.Equal(SubmissionConstants.ReviewDecision.Approved, version.Review!.Decision);\n        await auth.Received(1).EnsureCanManageAsync(projectId, ct);\n    }\n\n    [Fact]\n    public async Task ReviewAsync_RequestChanges_PersistsFeedbackAndAllowsRevisionUploadSession()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var seeded = await SeedCompletedSubmissionAsync(factory, projectId, studentId, ct, sessionCompleted: false);\n        var auth = AuthorizedContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(ct).Returns(\u0022Supervisor Name\u0022);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.CreateUploadGrantAsync(Arg.Any\u003Cstring\u003E(), \u0022application/pdf\u0022, ct)\n            .Returns(new ObjectUploadGrant(\u0022https://upload-v2\u0022, Now.AddMinutes(5), new Dictionary\u003Cstring, string\u003E()));\n        var sut = CreateSut(factory, auth, profile, storage);\n\n        var reviewed = await sut.ReviewAsync(projectId, seeded.SubmissionId, Guid.NewGuid(),\n            new CreateSubmissionReviewRequest(seeded.VersionId, SubmissionConstants.ReviewDecision.ChangesRequested, \u0022 Please revise \u0022), ct);\n        var revision = await sut.CreateUploadSessionAsync(projectId, seeded.RequirementId, studentId,\n            new CreateUploadSessionRequest(\u0022revision.pdf\u0022, \u0022application/pdf\u0022, 1024, \u0022v2\u0022), ct);\n\n        Assert.Equal(SubmissionConstants.SubmissionStatus.ChangesRequested, reviewed.Status);\n        Assert.Equal(\u0022Please revise\u0022, Assert.Single(reviewed.Versions).Review!.Feedback);\n        Assert.Equal(2, revision.VersionNumber);\n    }\n\n    [Fact]\n    public async Task GetDownloadUrlAsync_ExistingVersion_ReturnsStorageGrant()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteSubmissionFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var seeded = await SeedCompletedSubmissionAsync(factory, projectId, studentId, ct, sessionCompleted: false);\n        var auth = AuthorizedContext(projectId, studentId);\n        var storage = Substitute.For\u003CIObjectStorageService\u003E();\n        storage.CreateDownloadGrantAsync(\u0022projects/final/report.pdf\u0022, \u0022report.pdf\u0022, true, ct)\n            .Returns(new ObjectDownloadGrant(\u0022https://download\u0022, Now.AddMinutes(3)));\n        var sut = CreateSut(factory, auth, Substitute.For\u003CIUserProfileClient\u003E(), storage);\n\n        var response = await sut.GetDownloadUrlAsync(projectId, seeded.SubmissionId, seeded.VersionId, true, ct);\n\n        Assert.Equal(\u0022https://download\u0022, response.Url);\n        await auth.Received(1).EnsureCanAccessAsync(projectId, ct);\n    }\n\n    [Fact]\n    public async Task ListAndGetAsync_ExistingSubmission_ReturnMappedVersionAndRequirement()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = InMemorySubmissionFactory.Create();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var seeded = await SeedCompletedSubmissionAsync(factory, projectId, studentId, ct, sessionCompleted: false);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E(), Substitute.For\u003CIObjectStorageService\u003E());\n\n        var list = await sut.ListAsync(projectId, ct);\n        var single = await sut.GetAsync(projectId, seeded.SubmissionId, ct);\n\n        Assert.Single(list);\n        Assert.Equal(seeded.SubmissionId, single.Id);\n        Assert.Equal(\u0022Final report\u0022, single.Requirement.Title);\n        Assert.Single(single.Versions);\n    }\n\n    private static ResearchSubmissionService CreateSut(\n        IDbContextFactory\u003CSubmissionDbContext\u003E factory,\n        IProjectAuthorizationClient auth,\n        IUserProfileClient profile,\n        IObjectStorageService storage) =\u003E new(\n            factory,\n            auth,\n            profile,\n            storage,\n            new SubmissionOptions { AllowedFileTypes = [\u0022pdf\u0022, \u0022docx\u0022, \u0022pptx\u0022, \u0022zip\u0022], UploadSessionLifetimeMinutes = 10 },\n            new FixedTimeProvider(Now),\n            NullLogger\u003CResearchSubmissionService\u003E.Instance);\n\n    private static IProjectAuthorizationClient AuthorizedContext(Guid projectId, Guid studentId)\n    {\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        auth.GetSubmissionContextAsync(projectId, Arg.Any\u003CCancellationToken\u003E()).Returns(\n            new ProjectSubmissionContext(\n                new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022),\n                [new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.com\u0022, \u0022IT001\u0022)]));\n        return auth;\n    }\n\n    private static async Task\u003CSubmissionRequirement\u003E SeedRequirementAsync(\n        IDbContextFactory\u003CSubmissionDbContext\u003E factory,\n        Guid projectId,\n        Guid studentId,\n        CancellationToken ct)\n    {\n        var requirement = new SubmissionRequirement\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, Title = \u0022Final report\u0022, Description = \u0022Submit final report\u0022,\n            DueAt = Now.AddDays(1), AllowedFileTypes = \u0022pdf,docx\u0022, MaxFileSizeBytes = 10 * 1024 * 1024,\n            Status = SubmissionConstants.RequirementStatus.Open,\n            ResponsibilityMode = SubmissionConstants.ResponsibilityMode.ProjectLeader,\n            AssignedStudentId = studentId, AssignedStudentName = \u0022Sam Student\u0022,\n            CreatedBy = Guid.NewGuid(), CreatedByName = \u0022Supervisor\u0022, CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionRequirements.Add(requirement);\n        await db.SaveChangesAsync(ct);\n        return requirement;\n    }\n\n    private static async Task\u003CSubmissionUploadSession\u003E SeedPendingSessionAsync(\n        SqliteSubmissionFactory factory,\n        Guid projectId,\n        Guid requirementId,\n        Guid studentId,\n        DateTimeOffset expiresAt,\n        CancellationToken ct)\n    {\n        var session = new SubmissionUploadSession\n        {\n            Id = Guid.NewGuid(), ProjectId = projectId, RequirementId = requirementId,\n            SubmissionId = Guid.NewGuid(), VersionId = Guid.NewGuid(), ExpectedVersionNumber = 1,\n            TemporaryObjectKey = \u0022pending/test\u0022, FinalObjectKey = \u0022projects/final/test\u0022,\n            OriginalFileName = \u0022report.pdf\u0022, FileExtension = \u0022pdf\u0022, ExpectedContentType = \u0022application/pdf\u0022,\n            DeclaredFileSizeBytes = 1024, ExpectedMaxFileSizeBytes = 10 * 1024 * 1024,\n            CreatedBy = studentId, CreatedByName = \u0022Sam Student\u0022, Status = SubmissionConstants.UploadSessionStatus.Pending,\n            ActiveSlot = \u0022ACTIVE\u0022, ExpiresAt = expiresAt, CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionUploadSessions.Add(session);\n        await db.SaveChangesAsync(ct);\n        return session;\n    }\n\n    private static async Task\u003CSeededSubmission\u003E SeedCompletedSubmissionAsync(\n        IDbContextFactory\u003CSubmissionDbContext\u003E factory,\n        Guid projectId,\n        Guid studentId,\n        CancellationToken ct,\n        bool sessionCompleted = true)\n    {\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, ct);\n        var submissionId = Guid.NewGuid();\n        var versionId = Guid.NewGuid();\n        var sessionId = Guid.NewGuid();\n        await using var db = factory.CreateDbContext();\n        db.ResearchSubmissions.Add(new ResearchSubmission\n        {\n            Id = submissionId, ProjectId = projectId, RequirementId = requirement.Id,\n            Status = SubmissionConstants.SubmissionStatus.PendingReview,\n            CurrentVersionId = versionId, VersionCount = 1, LastSubmittedAt = Now, CreatedAt = Now\n        });\n        db.SubmissionVersions.Add(new SubmissionVersion\n        {\n            Id = versionId, SubmissionId = submissionId, VersionNumber = 1,\n            ObjectKey = \u0022projects/final/report.pdf\u0022, OriginalFileName = \u0022report.pdf\u0022, FileExtension = \u0022pdf\u0022,\n            ContentType = \u0022application/pdf\u0022, FileSizeBytes = 1024, ObjectETag = \u0022etag\u0022,\n            UploadedBy = studentId, UploadedByName = \u0022Sam Student\u0022, SubmitterRoleSnapshot = \u0022PROJECT_LEADER\u0022,\n            ResponsibilityModeSnapshot = SubmissionConstants.ResponsibilityMode.ProjectLeader,\n            SubmittedAt = Now, IsLate = false\n        });\n        db.SubmissionUploadSessions.Add(new SubmissionUploadSession\n        {\n            Id = sessionId, ProjectId = projectId, RequirementId = requirement.Id, SubmissionId = submissionId,\n            VersionId = versionId, ExpectedVersionNumber = 1, TemporaryObjectKey = \u0022pending/already\u0022,\n            FinalObjectKey = \u0022projects/final/report.pdf\u0022, OriginalFileName = \u0022report.pdf\u0022, FileExtension = \u0022pdf\u0022,\n            ExpectedContentType = \u0022application/pdf\u0022, DeclaredFileSizeBytes = 1024,\n            ExpectedMaxFileSizeBytes = 10 * 1024 * 1024, CreatedBy = studentId, CreatedByName = \u0022Sam Student\u0022,\n            Status = sessionCompleted ? SubmissionConstants.UploadSessionStatus.Completed : SubmissionConstants.UploadSessionStatus.Failed,\n            ActiveSlot = null, ExpiresAt = Now.AddMinutes(5), CreatedAt = Now, CompletedAt = sessionCompleted ? Now : null\n        });\n        await db.SaveChangesAsync(ct);\n        return new SeededSubmission(requirement.Id, submissionId, versionId, sessionId);\n    }\n\n    private sealed record SeededSubmission(Guid RequirementId, Guid SubmissionId, Guid VersionId, Guid SessionId);\n\n    private sealed class FixedTimeProvider(DateTimeOffset now) : TimeProvider\n    {\n        public override DateTimeOffset GetUtcNow() =\u003E now;\n    }\n\n    private sealed class InMemorySubmissionFactory : IDbContextFactory\u003CSubmissionDbContext\u003E, IAsyncDisposable\n    {\n        private readonly DbContextOptions\u003CSubmissionDbContext\u003E _options;\n\n        private InMemorySubmissionFactory(DbContextOptions\u003CSubmissionDbContext\u003E options)\n        {\n            _options = options;\n        }\n\n        public static InMemorySubmissionFactory Create()\n        {\n            var options = new DbContextOptionsBuilder\u003CSubmissionDbContext\u003E()\n                .UseInMemoryDatabase($\u0022submission-list-get-{Guid.NewGuid():N}\u0022)\n                .Options;\n            return new InMemorySubmissionFactory(options);\n        }\n\n        public SubmissionDbContext CreateDbContext() =\u003E new(_options);\n\n        public Task\u003CSubmissionDbContext\u003E CreateDbContextAsync(CancellationToken cancellationToken = default)\n            =\u003E Task.FromResult(CreateDbContext());\n\n        public ValueTask DisposeAsync() =\u003E ValueTask.CompletedTask;\n    }\n\n    private sealed class SqliteSubmissionFactory : IDbContextFactory\u003CSubmissionDbContext\u003E, IAsyncDisposable\n    {\n        private readonly SqliteConnection _connection;\n        private readonly DbContextOptions\u003CSubmissionDbContext\u003E _options;\n        private SqliteSubmissionFactory(SqliteConnection connection)\n        {\n            _connection = connection;\n            _options = new DbContextOptionsBuilder\u003CSubmissionDbContext\u003E().UseSqlite(connection).Options;\n        }\n        public static async Task\u003CSqliteSubmissionFactory\u003E CreateAsync(CancellationToken ct)\n        {\n            var connection = new SqliteConnection(\u0022Data Source=:memory:\u0022);\n            await connection.OpenAsync(ct);\n            var factory = new SqliteSubmissionFactory(connection);\n            await using var db = factory.CreateDbContext();\n            await db.Database.EnsureCreatedAsync(ct);\n            return factory;\n        }\n        public SubmissionDbContext CreateDbContext() =\u003E new(_options);\n        public Task\u003CSubmissionDbContext\u003E CreateDbContextAsync(CancellationToken cancellationToken = default) =\u003E Task.FromResult(CreateDbContext());\n        public ValueTask DisposeAsync() =\u003E _connection.DisposeAsync();\n    }\n}\n","tests":[{"id":"22ea5fc1-3214-b62d-cdfc-5b89fa7b54c4","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.CreateAndCompleteUploadSession_FirstVersion_PersistsSubmissionVersionAndCompletesSession","location":{"start":{"line":18,"column":5},"end":{"line":60,"column":6}}},{"id":"8ef72946-ec4b-42a1-bbfe-6e1eb45758ff","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.CompleteUploadSession_AlreadyCompleted_ReturnsExistingResponseWithoutPromotingAgain","location":{"start":{"line":62,"column":5},"end":{"line":78,"column":6}}},{"id":"12311936-cb34-1ac8-6781-d3a683f9e106","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.CompleteUploadSession_ExpiredSession_MarksExpiredAndDeletesTemporaryObject","location":{"start":{"line":80,"column":5},"end":{"line":100,"column":6}}},{"id":"f281a0e8-11c1-8e96-02ed-0e4fc4577d9e","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.CompleteUploadSession_MissingStorageObject_ReturnsValidationErrorWithoutPromotion","location":{"start":{"line":102,"column":5},"end":{"line":119,"column":6}}},{"id":"00e2e9cc-7c90-4926-12e1-f91420950216","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.ReviewAsync_ApproveCurrentVersion_PersistsReviewAndApprovalState","location":{"start":{"line":121,"column":5},"end":{"line":146,"column":6}}},{"id":"d54904b8-3fd0-fa46-309b-7cc3ac8f68bc","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.ReviewAsync_RequestChanges_PersistsFeedbackAndAllowsRevisionUploadSession","location":{"start":{"line":148,"column":5},"end":{"line":172,"column":6}}},{"id":"17db57dd-573f-969e-fc97-aa9d9e91f701","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.GetDownloadUrlAsync_ExistingVersion_ReturnsStorageGrant","location":{"start":{"line":174,"column":5},"end":{"line":192,"column":6}}},{"id":"e932e642-94bc-a659-7d28-43fb118aa015","name":"ResearchTrack.SubmissionService.MutationTests.Services.ResearchSubmissionSuccessfulFlowCoverageTests.ListAndGetAsync_ExistingSubmission_ReturnMappedVersionAndRequirement","location":{"start":{"line":194,"column":5},"end":{"line":211,"column":6}}}]},"/home/runner/work/researchtrack-backend/researchtrack-backend/tests/ResearchTrack.SubmissionService.MutationTests/Services/SubmissionMutationFinalHardeningTests.cs":{"language":"cs","source":"using Microsoft.Data.Sqlite;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Logging.Abstractions;\nusing NSubstitute;\nusing ResearchTrack.BuildingBlocks.Api.Exceptions;\nusing ResearchTrack.SubmissionService.Configuration;\nusing ResearchTrack.SubmissionService.Contracts;\nusing ResearchTrack.SubmissionService.Domain;\nusing ResearchTrack.SubmissionService.Features;\nusing ResearchTrack.SubmissionService.Infrastructure;\nusing ResearchTrack.SubmissionService.Persistence;\n\nnamespace ResearchTrack.SubmissionService.MutationTests.Services;\n\npublic sealed class SubmissionMutationFinalHardeningTests\n{\n    private static readonly DateTimeOffset Now = new(2026, 10, 11, 2, 0, 0, TimeSpan.Zero);\n    private const long MaxBytes = 10 * 1024 * 1024;\n\n    [Fact]\n    public async Task Requirement_Create_EnforcesExactDueAndSizeBoundaries()\n    {\n        var ct = CancellationToken.None;\n        await using var factory = await SqliteFactory.CreateAsync(ct);\n        var projectId = Guid.NewGuid(); var studentId = Guid.NewGuid();\n        var auth = Auth(projectId, studentId); var profile = Profile(\u0022Supervisor\u0022);\n rt":{"line":406,"column":5},"end":{"line":446,"column":6}}},{"id":"56a48229-f3e6-9dde-d6e2-8011d172994d","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionMutationFinalHardeningTests.CompleteUploadSession_AfterDueDateMarksLateAndUsesTemporaryMetadataWhenFinalLookupIsMissing","location":{"start":{"line":448,"column":5},"end":{"line":470,"column":6}}},{"id":"27879ab4-838a-67a5-fdc9-a1ff5b67cd99","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionMutationFinalHardeningTests.Review_ApprovalPersistsExactReviewerAndApprovalSnapshot","location":{"start":{"line":472,"column":5},"end":{"line":493,"column":6}}},{"id":"f211930d-b7c2-162c-40d3-fd56be6865be","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionMutationFinalHardeningTests.Review_StaleCurrentVersionMissingVersionAndDuplicateReviewAreDistinctConflicts","location":{"start":{"line":495,"column":5},"end":{"line":524,"column":6}}},{"id":"522e091a-1848-f51a-5c60-f73369711b94","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionMutationFinalHardeningTests.Download_ForwardsStoredObjectFileNameAndInlineFlagExactly","location":{"start":{"line":526,"column":5},"end":{"line":543,"column":6}}}]},"/home/runner/work/researchtrack-backend/researchtrack-backend/tests/ResearchTrack.SubmissionService.MutationTests/Services/SubmissionRequirementServiceCoverageTests.cs":{"language":"cs","source":"using Microsoft.EntityFrameworkCore;\nusing NSubstitute;\nusing ResearchTrack.BuildingBlocks.Api.Exceptions;\nusing ResearchTrack.SubmissionService.Configuration;\nusing ResearchTrack.SubmissionService.Contracts;\nusing ResearchTrack.SubmissionService.Domain;\nusing ResearchTrack.SubmissionService.Features;\nusing ResearchTrack.SubmissionService.Infrastructure;\nusing ResearchTrack.SubmissionService.Persistence;\n\nnamespace ResearchTrack.SubmissionService.MutationTests.Services;\n\npublic sealed class SubmissionRequirementServiceCoverageTests\n{\n    private static readonly DateTimeOffset Now = new(2026, 10, 10, 8, 0, 0, TimeSpan.Zero);\n\n    [Fact]\n    public async Task CreateAsync_ValidRequest_AuthorizesGetsProfileAndPersistsNormalizedRequirement()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var userId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var auth = AuthorizedContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        profile.GetCurrentUserDisplayNameAsync(CancellationToken.None).Returns(\u0022Ada Supervisor\u0022);\n        var sut = CreateSut(factory, auth, profile);\n\n        var result = await sut.CreateAsync(\n            projectId,\n            userId,\n            new SubmissionRequirementCreateRequest(\n                \u0022 Final Report \u0022, \u0022 Description \u0022, Now.AddDays(7), [\u0022PDF\u0022, \u0022docx\u0022], 1024 * 1024,\n                SubmissionConstants.ResponsibilityMode.AssignedStudent, studentId),\n            CancellationToken.None);\n\n        Assert.Equal(\u0022Final Report\u0022, result.Title);\n        Assert.Equal(\u0022Description\u0022, result.Description);\n        Assert.Equal(SubmissionConstants.RequirementStatus.Open, result.Status);\n        Assert.Equal(studentId, result.Responsibility.AssignedStudentId);\n        await auth.Received(1).EnsureCanManageAsync(projectId, CancellationToken.None);\n        await profile.Received(1).GetCurrentUserDisplayNameAsync(CancellationToken.None);\n        await using var db = factory.CreateDbContext();\n        var persisted = Assert.Single(db.SubmissionRequirements);\n        Assert.Equal(\u0022docx,pdf\u0022, persisted.AllowedFileTypes);\n        Assert.Equal(\u0022Ada Supervisor\u0022, persisted.CreatedByName);\n    }\n\n    [Fact]\n    public async Task CreateAsync_InvalidTitle_FailsBeforeProfileAndPersistence()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var auth = AuthorizedContext(projectId, studentId);\n        var profile = Substitute.For\u003CIUserProfileClient\u003E();\n        var sut = CreateSut(factory, auth, profile);\n\n        await Assert.ThrowsAsync\u003CApiValidationException\u003E(() =\u003E sut.CreateAsync(\n            projectId,\n            Guid.NewGuid(),\n            new SubmissionRequirementCreateRequest(\u0022 \u0022, null, null, [\u0022pdf\u0022], 1024,\n                SubmissionConstants.ResponsibilityMode.ProjectLeader, null),\n            CancellationToken.None));\n\n        await profile.DidNotReceive().GetCurrentUserDisplayNameAsync(Arg.Any\u003CCancellationToken\u003E());\n        await using var db = factory.CreateDbContext();\n        Assert.Empty(db.SubmissionRequirements);\n    }\n\n    [Fact]\n    public async Task UpdateAsync_ArchivedRequirement_IsReadOnly()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Archived);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.UpdateAsync(\n            projectId,\n            requirement.Id,\n            new SubmissionRequirementUpdateRequest(\u0022Updated\u0022, null, null, [\u0022pdf\u0022], 1024,\n                SubmissionConstants.ResponsibilityMode.ProjectLeader, null),\n            CancellationToken.None));\n\n        Assert.Equal(409, exception.StatusCode);\n    }\n\n    [Fact]\n    public async Task CloseReopenArchive_ChangesRequirementStatus()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Open);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E());\n        var ct = CancellationToken.None;\n\n        var closed = await sut.CloseAsync(projectId, requirement.Id, ct);\n        Assert.Equal(SubmissionConstants.RequirementStatus.Closed, closed.Status);\n        var reopened = await sut.ReopenAsync(projectId, requirement.Id, ct);\n        Assert.Equal(SubmissionConstants.RequirementStatus.Open, reopened.Status);\n        var archived = await sut.ArchiveAsync(projectId, requirement.Id, ct);\n        Assert.Equal(SubmissionConstants.RequirementStatus.Archived, archived.Status);\n    }\n\n    [Fact]\n    public async Task DeleteAsync_RequirementWithoutHistory_IsRemoved()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var requirement = await SeedRequirementAsync(factory, projectId, studentId, SubmissionConstants.RequirementStatus.Open);\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E());\n\n        await sut.DeleteAsync(projectId, requirement.Id, CancellationToken.None);\n\n        await using var db = factory.CreateDbContext();\n        Assert.Empty(db.SubmissionRequirements);\n    }\n\n    [Fact]\n    public async Task GetAsync_MissingRequirement_ReturnsNotFound()\n    {\n        var factory = new TestSubmissionDbContextFactory();\n        var projectId = Guid.NewGuid();\n        var studentId = Guid.NewGuid();\n        var sut = CreateSut(factory, AuthorizedContext(projectId, studentId), Substitute.For\u003CIUserProfileClient\u003E());\n\n        var exception = await Assert.ThrowsAsync\u003CApiException\u003E(() =\u003E sut.GetAsync(\n            projectId, Guid.NewGuid(), CancellationToken.None));\n\n        Assert.Equal(404, exception.StatusCode);\n    }\n\n    private static SubmissionRequirementService CreateSut(\n        TestSubmissionDbContextFactory factory,\n        IProjectAuthorizationClient auth,\n        IUserProfileClient profile) =\u003E new(\n            factory,\n            auth,\n            profile,\n            new SubmissionOptions { AllowedFileTypes = [\u0022pdf\u0022, \u0022docx\u0022, \u0022pptx\u0022, \u0022zip\u0022] },\n            new StorageOptions { MaximumFileSizeBytes = 10 * 1024 * 1024 },\n            new FixedTimeProvider(Now));\n\n    private static IProjectAuthorizationClient AuthorizedContext(Guid projectId, Guid studentId)\n    {\n        var auth = Substitute.For\u003CIProjectAuthorizationClient\u003E();\n        auth.GetSubmissionContextAsync(projectId, Arg.Any\u003CCancellationToken\u003E()).Returns(\n            new ProjectSubmissionContext(\n                new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.edu\u0022, \u0022IT001\u0022),\n                [new ProjectStudentContext(studentId, \u0022Sam Student\u0022, \u0022sam@example.edu\u0022, \u0022IT001\u0022)]));\n        return auth;\n    }\n\n    private static async Task\u003CSubmissionRequirement\u003E SeedRequirementAsync(\n        TestSubmissionDbContextFactory factory,\n        Guid projectId,\n        Guid studentId,\n        string status)\n    {\n        var requirement = new SubmissionRequirement\n        {\n            Id = Guid.NewGuid(),\n            ProjectId = projectId,\n            Title = \u0022Final report\u0022,\n            AllowedFileTypes = \u0022pdf,docx\u0022,\n            MaxFileSizeBytes = 10 * 1024 * 1024,\n            Status = status,\n            ResponsibilityMode = SubmissionConstants.ResponsibilityMode.ProjectLeader,\n            AssignedStudentId = studentId,\n            AssignedStudentName = \u0022Sam Student\u0022,\n            CreatedBy = Guid.NewGuid(),\n            CreatedByName = \u0022Ada Supervisor\u0022,\n            CreatedAt = Now\n        };\n        await using var db = factory.CreateDbContext();\n        db.SubmissionRequirements.Add(requirement);\n        await db.SaveChangesAsync(CancellationToken.None);\n        return requirement;\n    }\n\n    private sealed class TestSubmissionDbContextFactory : IDbContextFactory\u003CSubmissionDbContext\u003E\n    {\n        private readonly DbContextOptions\u003CSubmissionDbContext\u003E _options =\n            new DbContextOptionsBuilder\u003CSubmissionDbContext\u003E()\n                .UseInMemoryDatabase($\u0022submission-requirements-{Guid.NewGuid():N}\u0022)\n                .Options;\n        public SubmissionDbContext CreateDbContext() =\u003E new(_options);\n        public Task\u003CSubmissionDbContext\u003E CreateDbContextAsync(CancellationToken cancellationToken = default) =\u003E\n            Task.FromResult(CreateDbContext());\n    }\n\n    private sealed class FixedTimeProvider(DateTimeOffset now) : TimeProvider\n    {\n        public override DateTimeOffset GetUtcNow() =\u003E now;\n    }\n}\n","tests":[{"id":"f27caeb5-b935-7829-4486-e14d18e1b67e","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.CreateAsync_ValidRequest_AuthorizesGetsProfileAndPersistsNormalizedRequirement","location":{"start":{"line":17,"column":5},"end":{"line":47,"column":6}}},{"id":"da529b6f-1c9f-346c-2307-c0616dd26c47","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.CreateAsync_InvalidTitle_FailsBeforeProfileAndPersistence","location":{"start":{"line":49,"column":5},"end":{"line":69,"column":6}}},{"id":"04597a84-7fb0-bc2e-f7bc-54ccae66e30f","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.UpdateAsync_ArchivedRequirement_IsReadOnly","location":{"start":{"line":71,"column":5},"end":{"line":88,"column":6}}},{"id":"576cbd41-3411-8571-6651-348df9fe3ac1","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.CloseReopenArchive_ChangesRequirementStatus","location":{"start":{"line":90,"column":5},"end":{"line":106,"column":6}}},{"id":"370854cf-b10f-1ace-24a7-de9cb8f369b6","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.DeleteAsync_RequirementWithoutHistory_IsRemoved","location":{"start":{"line":108,"column":5},"end":{"line":121,"column":6}}},{"id":"722a6723-5432-1d7a-27be-bec77e7dfd1b","name":"ResearchTrack.SubmissionService.MutationTests.Services.SubmissionRequirementServiceCoverageTests.GetAsync_MissingRequirement_ReturnsNotFound","location":{"start":{"line":123,"column":5},"end":{"line":135,"column":6}}}]},"/home/runner/work/researchtrack-backend/researchtrack-backend/tests/ResearchTrack.SubmissionService.MutationTests/SubmissionFileRulesBoundaryTests.cs":{"language":"cs","source":"using ResearchTrack.SubmissionService.Features;\n\nnamespace ResearchTrack.SubmissionService.MutationTests;\n\npublic sealed class SubmissionFileRulesBoundaryTests\n{\n    [Theory]\n    [InlineData(\u0022 .PDF \u0022, \u0022pdf\u0022)]\n    [InlineData(\u0022..DOCX\u0022, \u0022docx\u0022)]\n    [InlineData(\u0022zip\u0022, \u0022zip\u0022)]\n    public void NormalizeExtension_StripsDotsWhitespaceAndNormalizesCase(string input, string expected)\n    {\n        Assert.Equal(expected, SubmissionFileRules.NormalizeExtension(input));\n    }\n\n    [Theory]\n    [InlineData(\u0022README\u0022)]\n    [InlineData(\u0022file.\u0022)]\n    public void ExtensionFromFileName_ReturnsNullWhenUsableExtensionIsMissing(string fileName)\n    {\n        Assert.Null(SubmissionFileRules.ExtensionFromFileName(fileName));\n    }\n\n    [Theory]\n    [InlineData(\u0022pdf\u0022, \u0022application/pdf\u0022)]\n    [InlineData(\u0022DOCX\u0022, \u0022application/vnd.openxmlformats-officedocument.wordprocessingml.document\u0022)]\n    [InlineData(\u0022pptx\u0022, \u0022application/vnd.openxmlformats-officedocument.presentationml.presentation\u0022)]\n    [InlineData(\u0022zip\u0022, \u0022application/zip\u0022)]\n    public void CanonicalContentType_ReturnsExpectedMimeType(string extension, string expected)\n    {\n        Assert.Equal(expected, SubmissionFileRules.CanonicalContentType(extension));\n    }\n\n    [Fact]\n    public void CanonicalContentType_ReturnsNullForUnknownExtension()\n    {\n        Assert.Null(SubmissionFileRules.CanonicalContentType(\u0022exe\u0022));\n    }\n\n    [Theory]\n    [InlineData(\u0022pdf\u0022, \u0022 APPLICATION/PDF \u0022)]\n    [InlineData(\u0022ZIP\u0022, \u0022 application/x-zip-compressed \u0022)]\n    public void ContentTypeMatchesExtension_NormalizesContentTypeAndExtension(string extension, string contentType)\n    {\n        Assert.True(SubmissionFileRules.ContentTypeMatchesExtension(extension, contentType));\n    }\n\n    [Theory]\n    [InlineData(\u0022pdf\u0022, \u0022application/octet-stream\u0022)]\n    [InlineData(\u0022exe\u0022, \u0022application/octet-stream\u0022)]\n    [InlineData(\u0022docx\u0022, \u0022application/pdf\u0022)]\n    public void ContentTypeMatchesExtension_RejectsUnknownOrMismatchedPairs(string extension, string contentType)\n    {\n        Assert.False(SubmissionFileRules.ContentTypeMatchesExtension(extension, contentType));\n    }\n\n    [Fact]\n    public void ParseAllowedTypes_RemovesEmptyDuplicatesAndSortsDeterministically()\n    {\n        Assert.Equal(\n            [\u0022docx\u0022, \u0022pdf\u0022, \u0022zip\u0022],\n            SubmissionFileRules.ParseAllowedTypes(\u0022 .PDF,docx,pdf, ,ZIP \u0022));\n    }\n\n    [Fact]\n    public void SerializeAllowedTypes_RemovesEmptyDuplicatesAndSortsDeterministically()\n    {\n        Assert.Equal(\n            \u0022docx,pdf,zip\u0022,\n            SubmissionFileRules.SerializeAllowedTypes([\u0022ZIP\u0022, \u0022\u0022, \u0022.pdf\u0022, \u0022docx\u0022, \u0022PDF\u0022]));\n    }\n\n    [Fact]\n    public void SafeOriginalFileName_StripsPathAndHonorsExactLengthBoundary()\n    {\n        Assert.Equal(\u0022report.pdf\u0022, SubmissionFileRules.SafeOriginalFileName(\u0022 /tmp/report.pdf \u0022, 20));\n        Assert.Equal(\u002212345\u0022, SubmissionFileRules.SafeOriginalFileName(\u002212345\u0022, 5));\n        Assert.Equal(\u002212345\u0022, SubmissionFileRules.SafeOriginalFileName(\u0022123456789\u0022, 5));\n    }\n}\n","tests":[{"id":"46882139-a41d-de8a-0b74-f4e106ea9030","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.NormalizeExtension_StripsDotsWhitespaceAndNormalizesCase","location":{"start":{"line":7,"column":5},"end":{"line":14,"column":6}}},{"id":"2f39cd10-a695-ea6b-c709-a0787585a61b","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.NormalizeExtension_StripsDotsWhitespaceAndNormalizesCase","location":{"start":{"line":7,"column":5},"end":{"line":14,"column":6}}},{"id":"161c20bd-062b-5d5c-65ee-d6bfb4ff6623","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.NormalizeExtension_StripsDotsWhitespaceAndNormalizesCase","location":{"start":{"line":7,"column":5},"end":{"line":14,"column":6}}},{"id":"07fe2d03-2ab8-ad21-3bf3-9101fb302056","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.ExtensionFromFileName_ReturnsNullWhenUsableExtensionIsMissing","location":{"start":{"line":16,"column":5},"end":{"line":22,"column":6}}},{"id":"c47076ab-ab30-c253-01d2-1ba490557428","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.ExtensionFromFileName_ReturnsNullWhenUsableExtensionIsMissing","location":{"start":{"line":16,"column":5},"end":{"line":22,"column":6}}},{"id":"c4a28e6c-c2f6-719f-5118-29665cc1e49d","name":"ResearchTrack.SubmissionService.MutationTests.SubmissionFileRulesBoundaryTests.CanonicalContentType_ReturnsExpect
